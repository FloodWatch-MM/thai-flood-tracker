name: Update Flood Data Bot

# ตั้งเวลาให้หุ่นยนต์ทำงาน
on:
  schedule:
    # รันทุกๆ 1 ชั่วโมง (นาทีที่ 0)
    - cron: '0 * * * *'
  # ปุ่มกดรันด้วยตัวเอง (เผื่ออยากทดสอบ)
  workflow_dispatch: 

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: 1. ดึงโค้ดจากโปรเจกต์
        uses: actions/checkout@v3

      - name: 2. ติดตั้ง Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. ติดตั้งไลบรารีที่จำเป็น (Supabase)
        run: pip install psycopg2-binary

      - name: 4. สั่งรันไฟล์ดึงข้อมูล
        run: python fetch_data.py
