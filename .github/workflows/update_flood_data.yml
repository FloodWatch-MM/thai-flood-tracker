name: Update Flood Data Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: 1. ดึงโค้ดจากโปรเจกต์
        uses: actions/checkout@v4

      - name: 2. ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. ติดตั้งไลบรารีที่จำเป็น (Supabase)
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: 4. สั่งรันไฟล์ดึงข้อมูล
        run: python fetch_data.py
